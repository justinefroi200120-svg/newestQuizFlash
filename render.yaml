services:
  - type: web
    name: quiz-flash
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TEACHER_REGISTRATION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: quiz-flash-db
          property: connectionString

databases:
  - name: quiz-flash-db
    plan: free
    databaseName: quiz_flash
    user: quiz_flash_user
